apiVersion: apps/v1
kind: Deployment
metadata:
  name: baryon-api
  namespace: baryon-ax
spec:
  replicas: 2
  selector:
    matchLabels: { app: baryon-api }
  template:
    metadata:
      labels: { app: baryon-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/example/baryon-ax-api:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: DOCUMENT_STORE, value: /data/documents }
            - { name: AUDIT_LOG, value: /data/audit/events.jsonl }
          envFrom: [{ secretRef: { name: baryon-api-config } }]
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: baryon-api
  namespace: baryon-ax
spec:
  selector: { app: baryon-api }
  ports: [{ port: 8000, targetPort: 8000 }]
