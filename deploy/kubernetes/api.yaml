apiVersion: apps/v1
kind: Deployment
metadata:
  name: baryon-api
  namespace: baryon-ax
spec:
  replicas: 2
  selector:
    matchLabels: { app: baryon-api }
  template:
    metadata:
      labels: { app: baryon-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/baryon-ax-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: baryon-api-config } }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 3 }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: baryon-api
  namespace: baryon-ax
spec:
  selector: { app: baryon-api }
  ports: [{ port: 8000, targetPort: 8000 }]
