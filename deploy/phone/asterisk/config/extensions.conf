; Calling the secretary extension (default 100) from the phone app connects the call to
; the voice secretary. AudioSocket needs a UUID per call; Asterisk 20 has no UUID()
; function, so the kernel's generator is used.
[secretary]
exten => ${SECRETARY_EXTENSION},1,Answer()
 same => n,Set(CALL_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,AudioSocket(${CALL_UUID},${GATEWAY_ADDRESS})
 same => n,Hangup()

exten => _X.,1,Goto(${SECRETARY_EXTENSION},1)
