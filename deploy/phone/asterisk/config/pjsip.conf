; One account for your phone's SIP app. Reach it only over a private network (tailnet/VPN).
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
${EXTERNAL_LINES}

[${PHONE_USER}]
type = endpoint
context = secretary
disallow = all
allow = ulaw,alaw
auth = ${PHONE_USER}-auth
aors = ${PHONE_USER}
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[${PHONE_USER}-auth]
type = auth
auth_type = userpass
username = ${PHONE_USER}
password = ${PHONE_PASSWORD}

[${PHONE_USER}]
type = aor
max_contacts = 3
remove_existing = yes
qualify_frequency = 30
