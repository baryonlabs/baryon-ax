name: baryon-ax

services:
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DOCUMENT_STORE: /data/documents
      AUDIT_LOG: /data/audit/events.jsonl
      MODEL_NAME: demo-local
      MODEL_BASE_URL: ""
      QDRANT_URL: ""
      DATABASE_URL: ""
      REDIS_URL: ""
      MEM0_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
      QDRANT_REINDEX_ON_START: "false"
    volumes:
      - documents:/data/documents
      - audit:/data/audit
      - mem0:/data/mem0
      - models:/data/fastembed
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy

  # Optional integration placeholders. The Basic Core does not use these yet.
  # Start them with: docker compose --profile deps up -d
  postgres:
    profiles: ["deps"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baryon}
      POSTGRES_USER: ${POSTGRES_USER:-baryon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["deps"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    profiles: ["deps"]
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  documents:
  audit:
  mem0:
  models:
  postgres:
  qdrant:
