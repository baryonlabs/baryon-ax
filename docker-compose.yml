name: baryon-ax

services:
  api:
    build:
      context: ./apps/api
      args:
        # Bake the multilingual embedding model into the image so search works without internet.
        PRELOAD_EMBEDDINGS: ${PRELOAD_EMBEDDINGS:-true}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    env_file: .env
    environment:
      DOCUMENT_STORE: /data/documents
      AUDIT_LOG: /data/audit/events.jsonl
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b}
      MODEL_BASE_URL: ${MODEL_BASE_URL_DOCKER:-http://host.docker.internal:11435/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
      # Retrieval: Qdrant vectors + lexical, fused (docs/retrieval.md). RETRIEVAL_MODE=lexical rolls back
      # without a rebuild; QDRANT_URL_DOCKER="" turns the vector index off entirely.
      QDRANT_URL: ${QDRANT_URL_DOCKER-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-baryon_documents}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      DATABASE_URL: ""
      REDIS_URL: ""
      MEM0_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
      # auto: on the first start against an empty collection, index the stored documents in the background.
      QDRANT_REINDEX_ON_START: ${QDRANT_REINDEX_ON_START:-auto}
      SYSTEM_METRICS_ENABLED: ${SYSTEM_METRICS_ENABLED:-true}
      DOCKER_PROJECT: ${DOCKER_PROJECT:-baryon-ax}
      HOST_PROC: /host/proc
      HOST_HOSTNAME: ${HOST_HOSTNAME:-}
      GAP_STORE: /data/gaps/gaps.jsonl
      TACIT_STORE: /data/tacit/tacit.jsonl
      # Ontology packs and answer feedback live on volumes too; without these they were written to /tmp
      # inside the container and lost whenever the container was recreated.
      ONTOLOGY_STORE: /data/ontology
      FEEDBACK_STORE: /data/feedback/feedback.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - documents:/data/documents
      - audit:/data/audit
      - mem0:/data/mem0
      - models:/data/fastembed
      - gaps:/data/gaps
      - tacit:/data/tacit
      - ontology:/data/ontology
      - feedback:/data/feedback
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
    ports:
      - "${BIND_HOST:-0.0.0.0}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${WEB_PORT:-3001}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Optional integration services (PostgreSQL audit, Redis rate limits) used by docker-compose.full.yml.
  # Start them with: docker compose --profile deps up -d
  postgres:
    profiles: ["deps"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baryon}
      POSTGRES_USER: ${POSTGRES_USER:-baryon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["deps"]
    image: redis:7-alpine
    ports:
      - "${BIND_HOST:-0.0.0.0}:${REDIS_PORT:-6379}:6379"

  # Vector index for document retrieval. Part of the default stack; it holds derived data only
  # (rebuild it any time with `docker compose exec api python -m baryon.reindex --recreate`).
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # Loopback only by default: Qdrant has no authentication, and the API reaches it on the compose network.
      - "${QDRANT_BIND_HOST:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  documents:
  audit:
  mem0:
  models:
  gaps:
  tacit:
  ontology:
  feedback:
  postgres:
  qdrant:
