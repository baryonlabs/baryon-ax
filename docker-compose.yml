name: baryon-ax

services:
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DOCUMENT_STORE: /data/documents
      AUDIT_LOG: /data/audit/events.jsonl
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b}
      MODEL_BASE_URL: ${MODEL_BASE_URL_DOCKER:-http://host.docker.internal:11435/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
      QDRANT_URL: ""
      DATABASE_URL: ""
      REDIS_URL: ""
      MEM0_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
      QDRANT_REINDEX_ON_START: "false"
      SYSTEM_METRICS_ENABLED: ${SYSTEM_METRICS_ENABLED:-true}
      DOCKER_PROJECT: ${DOCKER_PROJECT:-baryon-ax}
      HOST_PROC: /host/proc
      HOST_HOSTNAME: ${HOST_HOSTNAME:-}
      GAP_STORE: /data/gaps/gaps.jsonl
      TACIT_STORE: /data/tacit/tacit.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - documents:/data/documents
      - audit:/data/audit
      - mem0:/data/mem0
      - models:/data/fastembed
      - gaps:/data/gaps
      - tacit:/data/tacit
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
    ports:
      - "${BIND_HOST:-0.0.0.0}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./apps/web
    ports:
      - "${BIND_HOST:-0.0.0.0}:${WEB_PORT:-3001}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Optional integration placeholders. The Basic Core does not use these yet.
  # Start them with: docker compose --profile deps up -d
  postgres:
    profiles: ["deps"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baryon}
      POSTGRES_USER: ${POSTGRES_USER:-baryon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["deps"]
    image: redis:7-alpine
    ports:
      - "${BIND_HOST:-0.0.0.0}:${REDIS_PORT:-6379}:6379"

  qdrant:
    profiles: ["deps"]
    image: qdrant/qdrant:v1.12.5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${BIND_HOST:-0.0.0.0}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${BIND_HOST:-0.0.0.0}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  documents:
  audit:
  mem0:
  models:
  gaps:
  tacit:
  postgres:
  qdrant:
