name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: 0.13.7

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  aws-gateway:
    name: aws gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "uv==${UV_VERSION}"
      - name: Bedrock gateway tests (fake Bedrock client, no AWS calls)
        run: uv run --no-project --with-requirements requirements.txt --with pytest --with httpx python -m pytest -q test_app.py
        env:
          AWS_DEFAULT_REGION: ap-northeast-2
      - name: Keycloak AWS realm is generated from the dev realm
        working-directory: .
        run: |
          python3 deploy/aws/keycloak/make_realm.py
          git diff --exit-code -- deploy/aws/keycloak/realm-baryon-ax.aws.json

  stt:
    name: stt sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/stt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "uv==${UV_VERSION}"
      - name: STT sidecar tests (fake recognizer, no model download)
        run: uv run --no-project --with-requirements requirements.txt --with pytest --with httpx python -m pytest -q test_server.py

  secretary:
    name: voice secretary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/secretary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "uv==${UV_VERSION}"
      - name: Secretary tests (fake agent, no Claude CLI or network)
        run: uv run --no-project --with-requirements requirements.txt --with pytest --with httpx python -m pytest -q

  slack-bot:
    name: slack bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/slack-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "uv==${UV_VERSION}"
      - name: Slack bot tests (fake Slack and API, no network)
        run: uv run --no-project --with-requirements requirements.txt --with pytest python -m pytest -q tests

  phone:
    name: phone gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/phone/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "uv==${UV_VERSION}"
      - name: Gateway tests (fake Asterisk over a real socket, fake speech and secretary)
        run: uv run --no-project --with-requirements requirements.txt --with pytest python -m pytest -q test_gateway.py

  voice-app:
    name: voice app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Pinned: newer stable releases deprecate package:flutter/material.dart; move with an explicit upgrade.
        with: { channel: stable, flutter-version: "3.44.0", cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test

  locks:
    name: lockfile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install "uv==${UV_VERSION}"
      - name: apps/api uv.lock is current
        run: uv lock --check
        working-directory: apps/api
      # Consistency, not freshness: the existing pins are kept as preferences, so this
      # fails only when requirements.in and requirements.txt disagree. New upstream
      # releases no longer break every PR; the weekly "dependency pins" workflow
      # reports them instead.
      - name: docling requirements.txt matches requirements.in
        run: |
          cp requirements.txt "$RUNNER_TEMP/docling-requirements.txt"
          uv pip compile requirements.in \
            --python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header \
            -o "$RUNNER_TEMP/docling-requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/docling-requirements.txt"
        working-directory: deploy/parsers/docling
      - name: aws gateway requirements.txt matches requirements.in
        run: |
          cp requirements.txt "$RUNNER_TEMP/gateway-requirements.txt"
          uv pip compile requirements.in \
            --python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header --generate-hashes \
            -o "$RUNNER_TEMP/gateway-requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/gateway-requirements.txt"
        working-directory: deploy/aws/gateway
      - name: stt requirements.txt matches requirements.in
        run: |
          cp requirements.txt "$RUNNER_TEMP/stt-requirements.txt"
          uv pip compile requirements.in \
            --python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header --generate-hashes \
            -o "$RUNNER_TEMP/stt-requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/stt-requirements.txt"
        working-directory: deploy/stt
      - name: secretary requirements.txt matches requirements.in
        run: |
          cp requirements.txt "$RUNNER_TEMP/secretary-requirements.txt"
          uv pip compile requirements.in \
            --python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header --generate-hashes \
            -o "$RUNNER_TEMP/secretary-requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/secretary-requirements.txt"
        working-directory: apps/secretary
      - name: phone gateway requirements.txt matches requirements.in
        run: |
          cp requirements.txt "$RUNNER_TEMP/phone-requirements.txt"
          uv pip compile requirements.in \
            --python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header --generate-hashes \
            -o "$RUNNER_TEMP/phone-requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/phone-requirements.txt"
        working-directory: deploy/phone/gateway
      - name: kordoc package-lock.json is current
        run: npm ci --dry-run --omit=dev --no-audit --no-fund
        working-directory: deploy/parsers/kordoc
