name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: 0.13.7

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build

  locks:
    name: lockfile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install "uv==${UV_VERSION}"
      - name: apps/api uv.lock is current
        run: uv lock --check
        working-directory: apps/api
      - name: docling requirements.txt is current
        run: |
          uv pip compile requirements.in \
            --python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header \
            -o "$RUNNER_TEMP/docling-requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/docling-requirements.txt"
        working-directory: deploy/parsers/docling
      - name: kordoc package-lock.json is current
        run: npm ci --dry-run --omit=dev --no-audit --no-fund
        working-directory: deploy/parsers/kordoc
