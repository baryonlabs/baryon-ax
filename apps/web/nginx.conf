server {
  charset utf-8;
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # Voice recordings are 16 kHz WAV (about 2 MB a minute); nginx's default body limit is 1 MB.
  location /api/v1/audio/ { client_max_body_size 8m; proxy_pass http://api:8000/v1/audio/; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ { proxy_pass http://api:8000/; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}
